<div class="custom-fee-container">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&amp;display=swap" rel="stylesheet">

  <style>
    .custom-fee-container { font-family: 'Poppins', sans-serif; background-color: #ffffff; color: #333; padding: 0px; box-sizing: border-box; }
    .custom-fee-container .heading-container { margin-bottom: 0px; }
    .custom-fee-container h1 { font-size: 36px; font-weight: 700; margin: 0; color: #222; }
    .custom-fee-container .accordion-container { max-width: 100%; margin: 0 auto; }

    .custom-fee-container .accordion {
      background-color: #f1f1f1; cursor: pointer; padding: 20px 60px 20px 80px; width: 100%;
      border: none; text-align: left; outline: none; font-size: 22px; position: relative;
      min-height: 70px; display: flex; align-items: center; color: #333;
    }
    .custom-fee-container .accordion:hover { background-color: #ddd; }
    .custom-fee-container .accordion img.icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 58px; height: 58px; }
    .custom-fee-container .accordion:after { content: "+"; font-size: 28px; color: #333; position: absolute; right: 20px; }
    .custom-fee-container .accordion.active:after { content: "-"; }
    .custom-fee-container .accordion-section.empty { display: none; }

    .custom-fee-container .panel { padding: 10px 0 20px 0; background-color: white; display: none; font-size: 14px; line-height: 1.6; }
    .custom-fee-container .panel.open { display: block; }

    .custom-fee-container .fee-status { padding: 20px; font-size: 15px; color: #666; text-align: center; display: none; }
    .custom-fee-container .fee-status.visible { display: block; }
    .custom-fee-container .fee-status.error { color: #c0392b; }

    .custom-fee-container table.fee-table { width: 100%; border-collapse: collapse; border: 1px solid #ccc; font-size: 14px; margin-top: 10px; }
    .custom-fee-container table.fee-table th,
    .custom-fee-container table.fee-table td { border: 1px solid #ccc; padding: 8px; text-align: left; vertical-align: top; }
    .custom-fee-container table.fee-table th { background-color: #f9f9f9; font-weight: 600; }
    .custom-fee-container .fee-table th:nth-child(1), .custom-fee-container .fee-table td:nth-child(1) { width: 35%; }
    .custom-fee-container .fee-table th:nth-child(2), .custom-fee-container .fee-table td:nth-child(2) { width: 20%; }
    .custom-fee-container .fee-table th:nth-child(3), .custom-fee-container .fee-table td:nth-child(3) { width: 20%; }
    .custom-fee-container .fee-table th:nth-child(4), .custom-fee-container .fee-table td:nth-child(4) { width: 25%; }

    /* NEW: small note under amounts that vary by floor plan / unit */
    .custom-fee-container .fee-note { display: block; font-size: 12px; color: #777; line-height: 1.3; }

    @media (max-width: 650px) {
      .custom-fee-container .accordion { font-size: 13px; padding: 20px 60px 20px 60px; }
      .custom-fee-container .accordion img.icon { width: 40px; height: 40px; left: 10px; }
      .custom-fee-container .accordion:after { font-size: 18px; right: 16px; }
      .custom-fee-container .panel { font-size: 13px; }
      .custom-fee-container .fee-table th,
      .custom-fee-container .fee-table td { font-size: 10px; padding: 6px; }
      .custom-fee-container .fee-note { font-size: 9px; }
      .custom-fee-container .fee-table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    }
  </style>

  <div class="heading-container"></div>

  <div class="fee-status" id="fee-status">Loading pricing information…</div>

  <div class="accordion-container" id="fee-accordion">

    <div class="accordion-section" id="section-applicant">
      <button class="accordion active">
        <img class="icon" src="https://static.wixstatic.com/media/4f7dd4_99046d149a064c21bff0ed410d15c816~mv2.png" alt="Applicant Icon">
        Applicant Expenses
      </button>
      <div class="panel open">
        <table class="fee-table" id="table1">
          <thead><tr><th>Charge Description</th><th>Charge Type</th><th>Charge Event</th><th>Actual/Average Amount</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="accordion-section" id="section-essentials">
      <button class="accordion active">
        <img class="icon" src="https://static.wixstatic.com/media/4f7dd4_12e4559005a547368568c0b8903cd994~mv2.png" alt="Essentials Icon">
        Essentials (Required)
      </button>
      <div class="panel open">
        <table class="fee-table" id="table2">
          <thead><tr><th>Charge Description</th><th>Charge Type</th><th>Charge Event</th><th>Actual/Average Amount</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="accordion-section" id="section-addons">
      <button class="accordion active">
        <img class="icon" src="https://static.wixstatic.com/media/4f7dd4_8a97cffd1c364f29b05db26e21313467~mv2.png" alt="Add-Ons Icon">
        Add-Ons (Optional)
      </button>
      <div class="panel open">
        <table class="fee-table" id="table3">
          <thead><tr><th>Charge Description</th><th>Charge Type</th><th>Charge Event</th><th>Actual/Average Amount</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="accordion-section" id="section-situational">
      <button class="accordion active">
        <img class="icon" src="https://static.wixstatic.com/media/4f7dd4_9f3390bd094c44dda8194cfbf4220fb9~mv2.png" alt="Situational Icon">
        Situational Fees
      </button>
      <div class="panel open">
        <table class="fee-table" id="table4">
          <thead><tr><th>Charge Description</th><th>Charge Type</th><th>Charge Event</th><th>Actual/Average Amount</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
(function () {

  /* ============================================================
     CHANGE THESE TWO LINES PER COMMUNITY
  ============================================================ */
  var ASSET_ID   = "27626";
  var WORKER_URL = "https://pricingtables.bshives.workers.dev";

  /* If the same fee name shows up at more than one level (e.g. at the
     property AND floor plan level) in the same section, combine it into
     one row with a single price range. Set to false to list separately. */
  var MERGE_DUPLICATE_LABELS = true;

  /* ============================================================
     HELPERS
  ============================================================ */
  function money(n) {
    return "$" + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  function formatFrequency(freq) {
    if (!freq)               return "\u2014";
    if (freq === "one_time") return "One Time";
    if (freq === "monthly")  return "Fixed Rate";
    return "Varies by Usage";
  }

  function formatEvent(item) {
    if (item.is_situational) return "Situational";
    if (item.is_required)    return "Required";
    return "Optional";
  }

  function getCategory(item) {
    if (item.is_situational)                  return "situational";
    if (item.due_at_timing === "application") return "applicant";
    if (item.is_required)                     return "essentials";
    return "addons";
  }

  function levelNote(level) {
    if (level === "floor_plan") return "Varies by floor plan";
    if (level === "unit")       return "Varies by unit";
    return "";
  }

  /* Returns { min, max, text } — min/max are numbers when the amount is
     numeric (so rows can be merged), text is used otherwise. */
  function resolveAmount(item) {
    // Floor plan / unit fees: use the per-floor-plan / per-unit entries
    var s = item.entries_summary;
    if (s && s.min != null && s.max != null) {
      return { min: s.min, max: s.max, text: null };
    }
    switch (item.value_type) {
      case "range": {
        var lo = parseFloat(item.min_amount), hi = parseFloat(item.max_amount);
        if (isFinite(lo) && isFinite(hi)) return { min: lo, max: hi, text: null };
        return { min: null, max: null, text: "Varies" };
      }
      case "amount": {
        var a = parseFloat(item.amount);
        if (isFinite(a)) return { min: a, max: a, text: null };
        return { min: null, max: null, text: "\u2014" };
      }
      case "percentage":
        return { min: null, max: null, text: item.percentage_amount || "\u2014" };
      case "text":
        return { min: null, max: null, text: item.text_amount || "Varies" };
      default:
        return { min: null, max: null, text: "\u2014" };
    }
  }

  function amountHtml(row) {
    var main;
    if (row.min != null && row.max != null) {
      main = row.min === row.max ? money(row.min) : money(row.min) + " \u2013 " + money(row.max);
    } else {
      main = escHtml(row.text);
    }
    var notes = row.notes.filter(Boolean);
    var noteHtml = notes.length ? '<span class="fee-note">' + escHtml(notes.join(" / ")) + "</span>" : "";
    return main + noteHtml;
  }

  function escHtml(str) {
    if (str == null) return "";
    return String(str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* ============================================================
     FETCH
  ============================================================ */
  function fetchFees() {
    return fetch(WORKER_URL + "?asset=" + encodeURIComponent(ASSET_ID))
      .then(function (res) {
        if (!res.ok) throw new Error("Worker returned HTTP " + res.status);
        return res.json();
      })
      .then(function (json) {
        if (!json.data || !Array.isArray(json.data)) throw new Error("Unexpected API response");
        if (json.warnings && json.warnings.length) console.warn("Pricing warnings:", json.warnings);
        return json.data;
      });
  }

  /* ============================================================
     BUILD ROWS
  ============================================================ */
  function buildBuckets(raw) {
    var buckets = { applicant: [], essentials: [], addons: [], situational: [] };
    var index = {}; // category|label -> row (for merging)

    raw.forEach(function (item) {
      if (item.is_enabled === false) return;

      var cat = getCategory(item);
      var amt = resolveAmount(item);
      var row = {
        description: item.label,
        chargeType:  formatFrequency(item.frequency),
        event:       formatEvent(item),
        min: amt.min, max: amt.max, text: amt.text,
        notes: [levelNote(item.level)]
      };

      var key = cat + "|" + String(item.label || "").trim().toLowerCase();
      var existing = index[key];

      // Merge only when both rows have numeric amounts
      if (MERGE_DUPLICATE_LABELS && existing && existing.min != null && row.min != null) {
        existing.min = Math.min(existing.min, row.min);
        existing.max = Math.max(existing.max, row.max);
        row.notes.forEach(function (n) { if (n && existing.notes.indexOf(n) === -1) existing.notes.push(n); });
        return;
      }

      buckets[cat].push(row);
      if (!existing) index[key] = row;
    });

    return buckets;
  }

  /* ============================================================
     RENDER
  ============================================================ */
  function populateTable(container, tableId, rows) {
    var table = container.querySelector("#" + tableId);
    var tbody = table && table.querySelector("tbody");
    if (!tbody) return;
    tbody.innerHTML = "";

    var section = table.closest(".accordion-section");
    if (rows.length === 0) {
      if (section) section.classList.add("empty");
      return;
    }
    if (section) section.classList.remove("empty");

    rows.forEach(function (row) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + escHtml(row.description) + "</td>" +
        "<td>" + escHtml(row.chargeType)  + "</td>" +
        "<td>" + escHtml(row.event)       + "</td>" +
        "<td>" + amountHtml(row)          + "</td>";
      tbody.appendChild(tr);
    });
  }

  function showStatus(container, msg, isError) {
    var el = container.querySelector("#fee-status");
    if (!el) return;
    el.textContent = msg;
    el.className = "fee-status visible" + (isError ? " error" : "");
  }

  function hideStatus(container) {
    var el = container.querySelector("#fee-status");
    if (el) el.className = "fee-status";
  }

  function bindAccordions(container) {
    container.querySelectorAll(".accordion").forEach(function (btn) {
      if (btn.dataset.bound) return;
      btn.dataset.bound = "1";
      btn.addEventListener("click", function () {
        btn.classList.toggle("active");
        var panel = btn.nextElementSibling;
        if (panel) panel.classList.toggle("open");
      });
    });
  }

  /* ============================================================
     INIT — waits up to 5s for the container to appear in the DOM
     (handles Entrata injecting HTML asynchronously)
  ============================================================ */
  function init() {
    var attempts = 0;
    var maxAttempts = 50; // 50 x 100ms = 5 seconds

    function tryRun() {
      var container = document.querySelector(".custom-fee-container");
      if (!container || !container.querySelector("#table1 tbody")) {
        if (++attempts < maxAttempts) setTimeout(tryRun, 100);
        return;
      }

      bindAccordions(container);
      showStatus(container, "Loading pricing information\u2026", false);

      fetchFees()
        .then(function (raw) {
          var buckets = buildBuckets(raw);
          populateTable(container, "table1", buckets.applicant);
          populateTable(container, "table2", buckets.essentials);
          populateTable(container, "table3", buckets.addons);
          populateTable(container, "table4", buckets.situational);
          hideStatus(container);
        })
        .catch(function (err) {
          console.error("Pricing load error:", err);
          showStatus(container, "Pricing information is temporarily unavailable. Please check back shortly.", true);
        });
    }

    tryRun();
  }

  init();

})();
</script>

<!-- ============================================================
     EMBED SCROLL MODE — for the jasperatvictoryridge.com iframe embed.
     When this page is inside an iframe, it scrolls itself with its
     scrollbar hidden. No parent-page JavaScript is needed at all.
     Viewed directly (not in an iframe), the page is completely untouched.
============================================================ -->
<script>
(function () {
  if (window.self === window.top) return; /* only when embedded */

  var s = document.createElement("style");
  s.textContent =
    "html, body { margin: 0; }" +
    "html { overflow-y: scroll; overflow-x: hidden; scrollbar-width: none; -ms-overflow-style: none; }" +
    "html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }";
  (document.head || document.documentElement).appendChild(s);
})();
</script>
